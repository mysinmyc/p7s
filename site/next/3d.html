<!DOCTYPE html>
<html>
<head>
    <title>3D Perspective Rubik's Clock (2D Canvas)</title>
    <style>
        body { background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        canvas { background: #222; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <canvas id="clockCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('clockCanvas');
        const ctx = canvas.getContext('2d');

        // Layout settings based on your provided class structure
        const layout = {
            width: 800, height: 600,
            outer_clock_size: 350,
            outer_clock_left: 400, outer_clock_top: 300,
            inner_clock_size: 90, clock_border: 6,
            pin_size: 15
        };

        let rotationAngle = 0; // Rotation for animation

        function applyPerspective(centerX, centerY, angle) {
            const scaleX = Math.cos(angle);
            const skewY = Math.sin(angle) * 0.15; // Perspective strength
            
            // Transform matrix: [scaleX, skewY, skewX, scaleY, translateX, translateY]
            ctx.setTransform(scaleX, skewY, 0, 1, centerX, centerY);
        }

        function drawSingleClock(radius) {
            // Clock Face
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fillStyle = "#aeaeae";
            ctx.fill();
            ctx.stroke();

            // Hour Markers
            for (let h = 0; h < 12; h++) {
                ctx.beginPath();
                ctx.fillStyle = (h === 0) ? "#ab2e2d" : "#202020";
                ctx.arc(0, -radius + 8, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.rotate(Math.PI / 6);
            }
        }

        function drawHand(hour, radius) {
            ctx.save();
            ctx.rotate(Math.PI / 6 * hour);
            ctx.beginPath();
            ctx.lineWidth = 3;
            ctx.lineCap = "round";
            ctx.strokeStyle = "#333";
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -radius + 15);
            ctx.stroke();
            ctx.restore();
        }

        function render() {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            rotationAngle += 0.01;
            const currentAngle = Math.sin(rotationAngle) * 0.5; // Oscillate tilt

            // 1. Draw "Thickness" (Extrusion)
            for (let i = 8; i > 0; i--) {
                ctx.save();
                applyPerspective(layout.outer_clock_left + i, layout.outer_clock_top, currentAngle);
                ctx.beginPath();
                ctx.arc(0, 0, layout.outer_clock_size / 2, 0, Math.PI * 2);
                ctx.fillStyle = "#888"; // Darker side color
                ctx.fill();
                ctx.restore();
            }

            // 2. Draw Front Face
            ctx.save();
            applyPerspective(layout.outer_clock_left, layout.outer_clock_top, currentAngle);
            
            // Outer Body
            ctx.beginPath();
            ctx.arc(0, 0, layout.outer_clock_size / 2, 0, Math.PI * 2);
            ctx.fillStyle = "#dfdfdf";
            ctx.fill();
            ctx.strokeStyle = "#333";
            ctx.stroke();

            // Pins (2x2 Grid)
            const pinDist = layout.outer_clock_size / 6;
            [[-1,-1], [1,-1], [-1,1], [1,1]].forEach(([sx, sy]) => {
                ctx.beginPath();
                ctx.arc(sx * pinDist, sy * pinDist, layout.pin_size, 0, Math.PI * 2);
                ctx.fillStyle = "#161616";
                ctx.fill();
            });

            // Inner Clocks (3x3 Grid)
            const spacing = layout.outer_clock_size / 3.2;
            for (let i = 0; i < 9; i++) {
                const x = (i % 3 - 1) * spacing;
                const y = (Math.floor(i / 3) - 1) * spacing;
                
                ctx.save();
                ctx.translate(x, y);
                drawSingleClock(layout.inner_clock_size / 2);
                drawHand(i + 1, layout.inner_clock_size / 2); // Sample times
                ctx.restore();
            }

            ctx.restore();
            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
