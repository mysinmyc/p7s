<html>
    <head>
        <link rel="stylesheet" href="style.css" />
        <script src="util.js"></script>
        <script src="stats.js"></script>
        <script>

            function back() {
                location="index.html";
            }

            function cancella() {
                let stats_manager = new StatsManager();
                stats_manager.clear();
                document.location="?refresh="+(new Date().getTime());
            }          

            function init() {
                
                let stats_manager = new StatsManager();
                stats_manager.init();

                let best_html="";
                let cnt=0;
                stats_manager.stats.best.forEach(r => {
                    cnt++;
                    let tr_element = document.createElement("tr");
                    let td_class= cnt%2==0 ? "row" :  "row_alt";
                    tr_element.innerHTML= "<td class=\""+td_class+"\">"+cnt+"</td><td class=\""+td_class+"\">"+format_timer_ms(r.elasped_ms)+"</td><td class=\""+td_class+"\">"+format_time(r.time)+"</td><td class=\""+td_class+"\">"+format_scramble(r.scramble)+"</td>";
                    document.getElementById("tbl_best").appendChild(tr_element);
                });
                

                for (let cnt=1 ; cnt <= stats_manager.stats.recent.length && cnt <21;cnt++) {
                    let r=stats_manager.stats.recent[stats_manager.stats.recent.length-cnt];
                    let tr_element = document.createElement("tr");
                    let td_class= cnt%2==0 ? "row" :  "row_alt";
                    tr_element.innerHTML= "</td><td class=\""+td_class+"\">"+format_timer_ms(r.elasped_ms)+"</td><td class=\""+td_class+"\">"+format_time(r.time)+"</td><td class=\""+td_class+"\">"+format_scramble(r.scramble)+"</td>";
                    document.getElementById("tbl_recenti").appendChild(tr_element);

                }

                let pr_element = document.getElementById("pr");
                if (stats_manager.stats.best.length==0) {
                    pr_element.innerHTML="non disponibile";
                } else {
                    let pr=stats_manager.stats.best[0];
                    pr_element.innerHTML=format_timer_ms(pr.elasped_ms)+" registrato il "+format_time(pr.time);
                }

                let avg5_element = document.getElementById("avg5");
                if (stats_manager.stats.recent.length <5) {
                    avg5_element.innerHTML="non disponibile";
                } else {
                    let sum=0;
                    for (let cnt=1 ; cnt <=5;cnt++) {
                        sum+=truncate_ms(stats_manager.stats.recent[stats_manager.stats.recent.length-cnt].elasped_ms);
                    }
                    avg5_element.innerHTML=format_timer_ms(Math.trunc(sum/5));

                }
            }
        </script>
    </head>
    <body onLoad="init()">
        <div class="title">
            <img src="title.png" width="400px"/>
        </div>

			
        <div class="buttonBar" style="position: fixed;top: 20px;right: 20px;">
            <input type="button" onClick="back();" value="Indietro"/>				
        </div>        
        
        <div class="panel" style="margin-top: 60px">
            <div class="panel_title">Personal Record</div>
            Personal record <span id="pr"></span>
        </div>

        <div class="panel" style="margin-top: 60px">
            <div class="panel_title">Media</div>
            Tempo medio ultimi 5 <span id="avg5"></span>
        </div>

        <div class="panel" style="margin-top: 60px;">
            <div class="panel_title">Risulti migliori</div>
            <table>
                <tbody id="tbl_best">
                    <tr>
                            <td class="head">posizione</td>
                            <td class="head">tempo</td>
                            <td class="head">registrato il</td>
                            <td class="head">scramble</td>
                        </tr>
                </tbody>
            </table>
        </div>

        <div class="panel" style="margin-top: 60px;">
            <div class="panel_title">Recenti</div>
            <table>
                <tbody id="tbl_recenti">
                    <tr>
                        <td class="head">tempo</td>
                        <td class="head">registrato il</td>
                        <td class="head">scramble</td>
                    </tr>
                </tbody>
            </table>
        </div>        

        <div class="panel" style="margin-top: 60px;">
            <div class="panel_title">Azioni</div>
            <input type="button" onclick="cancella();" value="Cancella Statistiche"/>
        </div>          
    </body>
</html>
