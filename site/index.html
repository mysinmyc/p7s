<html>
<head>
	<style>
		body {
  			background-image: url('background.jpeg');
  			background-repeat: no-repeat;
  			background-attachment: fixed;
  			background-size: 100% 100%;
		}

		input.inputClock {
			width: 100%; 
			height: 100%; 
			text-align: center; 
			border-radius: 5px; 
			border: 1px solid #999; 
			font-size: 1.1rem; 
		}


		.buttonBar {
			border-radius: 25px;
			padding: 20px;
			background-color: #fff3c1;
			position:absolute;
    		top: 60px;
    		right: 60px;
		}

		.solution {
			border-radius: 25px;
			padding: 20px;
			background-color: #fff3c1;
			position:absolute;
			top: 140px;
    		right: 60px;
			font-size:  40;
			color: red;
		}

		.clockInputs {
			border-radius: 25px;
			padding: 20px;
			background-color: #fff3c1;
			display: flex; gap: 20px;
			width: fit-content;
		}

		.title {
			border-radius: 25px;
			padding: 5px;
			background-color: #fff3c1;
			width: fit-content;		
		}


	</style>
	<script src="clock.js">

	</script>
	<script>

		const clock = new Clock();

		const default_settings = {
			show_values: false,
			show_one_clock: false,
			reverse_second_clock: true,
			first_clock_face_a: true
		}

		var settings = default_settings;

		function update_clock_data(uiToDomain) {
			for (var cnt=0;cnt<9;cnt++) {	
				controlA=document.getElementById("faceA"+cnt); 
				controlB=document.getElementById("faceB"+cnt); 
				if (uiToDomain) {
					clock.face_a[cnt]=parseInt(controlA.value);
					clock.face_b[cnt]=parseInt(controlB.value);
				} else {
					controlA.value=clock.face_a[cnt];
					controlB.value=clock.face_b[cnt];
				}
			
			}	
		}
		
		function update_settings(uiToDomain) {
			chkShowValues = document.getElementById("chkShowValues");
			chkOneClock = document.getElementById("chkOneClock");
			chkReverseSecondClock = document.getElementById("chkReverseSecondClock");
			if (uiToDomain) {
				settings.show_values = chkShowValues.checked;
				settings.show_one_clock = chkOneClock.checked;
				settings.reverse_second_clock = chkReverseSecondClock.checked;				
			} else {
				chkShowValues.checked = settings.show_values;
				chkOneClock.checked = settings.show_one_clock;
				chkReverseSecondClock.checked = settings.reverse_second_clock;
			}
		}

		function draw_clock() {
			var clock_drawer = new ClockDrawer(clock);

			myCanvasA = document.getElementById("myCanvasA");
			myCanvasB = document.getElementById("myCanvasB");

			myCanvasB.style.display =  settings.show_one_clock ? "none" : "block";
			if (settings.first_clock_face_a) {
				clock_drawer.draw_face_a(myCanvasA.getContext("2d"),myCanvasA.clientWidth,myCanvasA.clientHeight,settings.show_values);
				if (!settings.show_one_clock) {
					clock_drawer.draw_face_b(myCanvasB.getContext("2d"),myCanvasB.clientWidth,myCanvasB.clientHeight,settings.show_values,settings.reverse_second_clock);
				}
			} else {
				clock_drawer.draw_face_b(myCanvasA.getContext("2d"),myCanvasA.clientWidth,myCanvasA.clientHeight,settings.show_values,settings.reverse_second_clock);				
				if (!settings.show_one_clock) {
					clock_drawer.draw_face_a(myCanvasB.getContext("2d"),myCanvasB.clientWidth,myCanvasB.clientHeight,settings.show_values);
				}
				
			}
			
			
			update_clock_data(false);

			var chkShowSolution=document.getElementById("chkShowSolution");	
			var solution = document.getElementById("solution");
			if (chkShowSolution.checked) {
				solution.style.display ="block";
				solution7SimulBpaul=compute7SimulBPaul(clock.face_a,clock.face_b);
				solution.innerHTML =  "7 simul flip (Bpaul): "+array2Letters(solution7SimulBpaul)+" ("+solution7SimulBpaul+")";
			} else {	
				solution.style.display = "none";
				solution="";
			}
			
		}	

		function reset_clock() {
			clock.reset();
			save_state();			
			draw_clock();
		}

		function scramble_clock() {
			clock.scramble();
			save_state();			
			draw_clock();
		}
		
		function save_state() {
			localStorage.setItem("clockA", JSON.stringify(clock.face_a));
			localStorage.setItem("clockB", JSON.stringify(clock.face_b));
			localStorage.setItem("settings", JSON.stringify(settings));
		}

		function load_state() {
			clock.face_a= JSON.parse(localStorage.getItem("clockA") ?? "[0,0,0,0,0,0,0,0,0]");
			clock.face_b= JSON.parse(localStorage.getItem("clockB") ?? "[0,0,0,0,0,0,0,0,0]");
			settings = JSON.parse(localStorage.getItem("settings") ?? JSON.stringify(default_settings));
			draw_clock();
			update_settings(false);
		}
				
		function set_clock_data() {
			update_clock_data(true);
			save_state();
			draw_clock();
		}

		function set_settings() {
			update_settings(true);
			save_state();
			draw_clock();
		}

		function invert_clocks() {
			console.log("clicked");
			settings.first_clock_face_a = ! settings.first_clock_face_a;
			save_state();
			draw_clock();
		}

		function showArea() {
			["welcome"].forEach( e=> document.getElementById(e).style.display="none");
			["appArea"].forEach( e=> document.getElementById(e).style.display="block");
			load_state();
		}

		function init() {
			setTimeout(showArea, 2000);
		}

	</script>
</head>

<body onLoad="init()">
	<span id="welcome">
		<table style="width: 100%" height="100%">
			<tr>
				<td align="center">
					<img src="logo.png" width="600px"/>
				</td>
			</tr>
		</table>
	</span>
	<span id="appArea" style="display: none">
		<div class="buttonBar">
			<input type="button" onClick="reset_clock();" value="Reset"/>
			<input type="button" onClick="scramble_clock();" value="Scramble"/>
			<input type="checkbox" id="chkShowSolution" onClick="set_settings();"/>Solution
			<input type="checkbox" id="chkShowValues" onClick="set_settings();"/>Values
			<input type="checkbox" id="chkOneClock" onClick="set_settings();"/>One Clock
			<input type="checkbox" id="chkReverseSecondClock" onClick="set_settings();"/>Reverse second clock
		</div>

		<table width="100%" height="100%">
			<tr>
				<td style="padding: 20px;">
					<div class="title">
						<img src="title.png" width="400px"/>
					<div>
				</td>
			</tr>
			<tr>
				<td align="center">
					<div style="display: flex; width: fit-content;">
						<canvas class="clockA" id="myCanvasA" width="600" height="600" onclick="invert_clocks();"></canvas>
						<canvas class="clockB" id="myCanvasB" width="600" height="600" onclick="invert_clocks();"></canvas>		
					</div>
					<div class="clockInputs" id="clockInputs">
						<table style="background-color: #a3a3a3; padding: 10px;">
							<tr>
								<td><input type="number" class="inputClock" id="faceA0" onChange="set_clock_data();"/></td>
								<td><input type="number" class="inputClock" id="faceA1" onChange="set_clock_data();"/></td>
								<td><input type="number" class="inputClock" id="faceA2" onChange="set_clock_data();"/></td>
							</tr>
							<tr>
								<td><input type="number" class="inputClock" id="faceA3" onChange="set_clock_data();"/></td>
								<td><input type="number" class="inputClock" id="faceA4" onChange="set_clock_data();"/></td>
								<td><input type="number" class="inputClock" id="faceA5" onChange="set_clock_data();"/></td>
							</t>
							<tr>
								<td><input type="number" class="inputClock" id="faceA6" onChange="set_clock_data();"/></td>
								<td><input type="number" class="inputClock" id="faceA7" onChange="set_clock_data();"/></td>
								<td><input type="number" class="inputClock" id="faceA8" onChange="set_clock_data();"/></td>
							</t>
						</table>

						<table style="background-color: #161616; padding: 10px;">
							<tr>
								<td><input type="number" class="inputClock" id="faceB0" onChange="set_clock_data();"/></td>
								<td><input type="number" class="inputClock" id="faceB1" onChange="set_clock_data();"/></td>
								<td><input type="number" class="inputClock" id="faceB2" onChange="set_clock_data();"/></td>
							</tr>
							<tr>
								<td><input type="number" class="inputClock" id="faceB3" onChange="set_clock_data();"/></td>
								<td><input type="number" class="inputClock" id="faceB4" onChange="set_clock_data();"/></td>
								<td><input type="number" class="inputClock" id="faceB5" onChange="set_clock_data();"/></td>
							</t>
							<tr>
								<td><input type="number" class="inputClock" id="faceB6" onChange="set_clock_data();"/></td>
								<td><input type="number" class="inputClock" id="faceB7" onChange="set_clock_data();"/></td>
								<td><input type="number" class="inputClock" id="faceB8" onChange="set_clock_data();"/></td>
							</t>
						</table>				
					</div>			
				</td>
			</tr>
		</table>
		
		<span id="solution" class="solution"/>
	</span>
</body>
</html>
