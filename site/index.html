<html>
<head>
	<link rel="stylesheet" href="style.css" />
	<script src="util.js"></script>
	<script src="model.js"></script>
	<script src="stats.js"></script>
	<script src="solution.js"></script>
	<script src="graphics.js"></script>
	<script src="game.js"></script>
	<script>

		var clock_game;

		const default_settings = {
			config_version: 3,
			show_button_panel: true,			
			show_editor: false,
		}

		var _globals  = { settings: default_settings };

		function update_clock_data(uiToDomain) {
			for (var cnt=0;cnt<18;cnt++) {	
				inputValue=document.getElementById("innerClockValue"+cnt); 
				if (uiToDomain) {
					clock_game.state.clock.inner_clocks[cnt].value=parseInt(inputValue.value);
				} else {
					inputValue.value=clock_game.state.clock.inner_clocks[cnt].value;
				}
			
			}	
		}
		
		function update_settings(uiToDomain) {
			chkEdit = document.getElementById("chkEdit");
			chkButtonPanel = document.getElementById("chkButtonPanel");
			chkDebug = document.getElementById("chkDebug");
			if (uiToDomain) {
				_globals.settings.show_editor = chkEdit.checked;
				clock_game.debug = chkDebug.checked;
				_globals.settings.show_button_panel = chkButtonPanel.checked;
			} else {
				chkEdit.checked = _globals.settings.show_editor;
				chkDebug.checked = clock_game.debug;
				chkButtonPanel.checked = _globals.settings.show_button_panel;
			}
		}

		function write_solution(c) {
			var solution = document.getElementById("solution");
			solution7SimulBpaul=compute7SimulBPaul(c);
			solution.innerHTML =  "7 simul flip (Bpaul): "+array2Letters(solution7SimulBpaul)+" ("+solution7SimulBpaul+")";
		}

		function refreshComponents() {
			clockInputs= document.getElementById("clockInputs");
			clockInputs.style.display = _globals.settings.show_editor ? "block" : "none";
			button_panel = document.getElementById("button_panel");
			button_panel.style.display = _globals.settings.show_button_panel ? "block" : "none";
			clock_game.execute((c,v)=> {
			},true);			
		}

		function write_last_scramble() {
			document.getElementById("scramble").innerHTML = "Last scramble: "+format_scramble(clock_game.state.last_scramble);
		}

		function new_game() {
			clock_game.new_game();
			write_last_scramble();
		}

		function save_settings() {
			localStorage.setItem("settings", JSON.stringify(_globals.settings));
		}

		function load_settings() {
			_globals.settings = JSON.parse(localStorage.getItem("settings") ?? JSON.stringify(default_settings));
			if (_globals.settings.config_version == undefined || _globals.settings.config_version < default_settings.version) {
				_globals.settings = default_settings;
				save_settings();
			}
			update_settings(false);
			refreshComponents();
		}
				
		function set_clock_data() {
			clock_game.execute((c,v)=> update_clock_data(true));
		}


		function show_stats() {
			location="stats.html";
		}


		function show_help() {
			location="help.html";
		}

		function set_settings() {
			update_settings(true);
			save_settings();
			refreshComponents();
		}

		function flipX2() {
			clock_game.execute((game_state)=>game_state.clock_view.flipX2());
		}

		function flipY2() {
			clock_game.execute((game_state)=>game_state.clock_view.flipY2());
		}

		function rotate180() {
			clock_game.execute((game_state)=>game_state.clock_view.rotate180());
		}

		function rotate_gear_UR_plus() {
			clock_game.execute((game_state)=>game_state.clock_view.rotate_gear_UR(1));
		}

		function rotate_gear_UL_plus() {
			clock_game.execute((game_state)=>game_state.clock_view.rotate_gear_UL(1));
		}

		function rotate_gear_UR_minus() {
			clock_game.execute((game_state)=>game_state.clock_view.rotate_gear_UR(-1));
		}

		function rotate_gear_UL_minus() {
			clock_game.execute((game_state)=>game_state.clock_view.rotate_gear_UL(-1));
		}

		function rotate_gear_DR_plus() {
			clock_game.execute((game_state)=>game_state.clock_view.rotate_gear_DR(1));
		}

		function rotate_gear_DL_plus() {
			clock_game.execute((game_state)=>game_state.clock_view.rotate_gear_DL(1));
		}

		function rotate_gear_DR_minus() {
			clock_game.execute((game_state)=>game_state.clock_view.rotate_gear_DR(-1));
		}

		function rotate_gear_DL_minus() {
			clock_game.execute((game_state)=>game_state.clock_view.rotate_gear_DL(-1));
		}


		function show_solution() {
			var divSolution = document.getElementById("divSolution");
			divSolution.style.display = divSolution.style.display  != "block" ? "block" :" none";
		}

		function test_solution() {
			clock_game.execute((game_state) => {
				//game_state.to_stage("lose");
				exec7SimulBPaul(game_state.clock);
			});
		}
		
		function show_settings() {
			settings= document.getElementById("settings");
			settings.style.display = settings.style.display != "block" ? "block" : "none";
		}

		function show_game() {
			["welcome"].forEach( e=> document.getElementById(e).style.display="none");
			["appArea"].forEach( e=> document.getElementById(e).style.display="block");

			clock_game.new_game();			
			write_solution(clock_game.state.clock);			

			if(window.innerHeight < window.innerWidth){
				window.scrollTo(0,250);			
			}
		}

		function resizeCanvas(){
			myCanvasA = document.getElementById("myCanvasA");
    		myCanvasA.width = window.innerWidth;
    		myCanvasA.height = window.innerHeight;
			if (clock_game != undefined) {
				clock_game.resize();
			}
		}
		
		function init() {
			myCanvasA = document.getElementById("myCanvasA");
			resizeCanvas();         
			window.addEventListener('resize', resizeCanvas, false);

			clock_game = new ClockGame(myCanvasA);
			load_settings();	
			clock_game.addChangeListener((game_state)=>update_clock_data(false));
			clock_game.addChangeListener((game_state)=> {
				write_solution(game_state.clock);
			});			
			setTimeout(show_game, 2000);
		}



	</script>
</head>

<body onLoad="init()">

	<div style="display: none;">
		<img id="asset_title" src="title.png"/>
		<img id="asset_coppa_oro" src="coppa_oro.png"/>
		<img id="asset_coppa_grigia" src="coppa_grigia.png"/>
		<img id="asset_medaglia" src="medaglia.png"/>
		<img id="asset_stackmat" src="stackmat.png"/>
	</div>

	<span id="welcome">
		<table style="width: 100%" height="100%">
			<tr>
				<td align="center">
					<img src="logo.png" width="700px"/>
				</td>
			</tr>
		</table>
	</span>
	<span id="appArea" style="display: none; margin-top: 300;margin-bottom: 300;">

		<center>
			
			<div class="buttonBar" style="position: fixed;top: 20px;right: 20px;">
				<input type="button" onClick="new_game();" value="Nuova partita"/>				
				<input type="button" onClick="show_settings();" value="Impostazioni"/>
				<input type="button" onClick="show_stats();" value="Statistiche"/>			
				<input type="button" onClick="show_help();" value="Aiuto"/>			
			</div>

			<div class="buttonBar" style="position: fixed; right:20px;bottom:20px" id="button_panel">
				<table>
					<tr>
						<td>
							<input type="button" class="red" onClick="rotate_gear_UL_minus();" value="UL -"/>
						</td>
						<td>
							<input type="button" class="green" onClick="rotate_gear_UL_plus();" value="UL +"/>					
						</td>
						<td>
							&nbsp;
						</td>
						<td>
							<input type="button" class="red" onClick="rotate_gear_UR_minus();" value="UR -"/>
						</td>
						<td>
							<input type="button" class="green" onClick="rotate_gear_UR_plus();" value="UR +"/><br/>
						</td>
					</tr>
					<tr>
						<td colspan="2">
							&nbsp;
						</td>
						<td>
							<input type="button" onClick="rotate180();" value="R180"/>
						</td>
						<td colspan="2" style="text-align: center;">
							<input type="button" class="white" onClick="flipY2();" value="flip Y2"/>					
						</td>
					</tr>
					<tr>
						<td>
							<input type="button" class="red" onClick="rotate_gear_DL_minus();" value="DL -"/>
						</td>
						<td>
							<input type="button" class="green" onClick="rotate_gear_DL_plus();" value="DL +"/>					
						</td>
						<td>
							<input type="button" class="white" onClick="flipX2();" value="flip X2"/>
						</td>
						<td>
							<input type="button" class="red" onClick="rotate_gear_DR_minus();" value="DR -"/>
						</td>
						<td>
							<input type="button" class="green" onClick="rotate_gear_DR_plus();" value="DR +"/><br/>
						</td>
					</tr>					
				</table>			
			</div>
						
			<div class="settings panel" id="settings" style="position: fixed; top: 120px;right: 20px">
				<input type="checkbox" id="chkEdit" onClick="set_settings();"/>Editor
				&nbsp;
				<input type="checkbox" id="chkButtonPanel" onClick="set_settings();"/>Mostra barra pulsanti
				&nbsp;
				<input type="checkbox" id="chkDebug" onClick="set_settings();"/>Debug
				<br/>
				<span id="scramble"></span>			
				<br/>
				<input type="button" onClick="show_solution();" value="Soluzione"/>
			</div>

			<div id="divSolution" class="solution" style="display: none;">
				<span id="solution"></span>
				<br/>
				<input type="button" class="white" onClick="test_solution();" value="Test"/>	
			</div>



			<div class="clocks">
				<canvas id="myCanvasA"></canvas>
			</div>



			<div class="clockInputs" id="clockInputs">
				<table style="background-color: #a3a3a3; padding: 10px;">
					<tr>
						<td><input type="number" class="inputClock" id="innerClockValue0" onChange="set_clock_data();"/></td>
						<td><input type="number" class="inputClock" id="innerClockValue1" onChange="set_clock_data();"/></td>
						<td><input type="number" class="inputClock" id="innerClockValue2" onChange="set_clock_data();"/></td>
					</tr>
					<tr>
						<td><input type="number" class="inputClock" id="innerClockValue3" onChange="set_clock_data();"/></td>
						<td><input type="number" class="inputClock" id="innerClockValue4" onChange="set_clock_data();"/></td>
						<td><input type="number" class="inputClock" id="innerClockValue5" onChange="set_clock_data();"/></td>
					</t>
					<tr>
						<td><input type="number" class="inputClock" id="innerClockValue6" onChange="set_clock_data();"/></td>
						<td><input type="number" class="inputClock" id="innerClockValue7" onChange="set_clock_data();"/></td>
						<td><input type="number" class="inputClock" id="innerClockValue8" onChange="set_clock_data();"/></td>
					</t>
				</table>

				<table style="background-color: #161616; padding: 10px;">
					<tr>
						<td><input type="number" class="inputClock" id="innerClockValue9" onChange="set_clock_data();"/></td>
						<td><input type="number" class="inputClock" id="innerClockValue10" onChange="set_clock_data();"/></td>
						<td><input type="number" class="inputClock" id="innerClockValue11" onChange="set_clock_data();"/></td>
					</tr>
					<tr>
						<td><input type="number" class="inputClock" id="innerClockValue12" onChange="set_clock_data();"/></td>
						<td><input type="number" class="inputClock" id="innerClockValue13" onChange="set_clock_data();"/></td>
						<td><input type="number" class="inputClock" id="innerClockValue14" onChange="set_clock_data();"/></td>
					</t>
					<tr>
						<td><input type="number" class="inputClock" id="innerClockValue15" onChange="set_clock_data();"/></td>
						<td><input type="number" class="inputClock" id="innerClockValue16" onChange="set_clock_data();"/></td>
						<td><input type="number" class="inputClock" id="innerClockValue17" onChange="set_clock_data();"/></td>
					</t>
				</table>				

			</div>	
		</center>
	
	</span>

	
</body>
</html>
